[package]
name = "nadendar"
version = "0.1.0"
description = "Nadendar — le calendrier de nads"
authors = ["Nads"]
license = "MIT"
edition = "2021"

[lib]
# Le suffixe _lib évite un conflit de nom avec le binaire sous Windows ;
# cdylib/staticlib sont nécessaires pour Android.
name = "nadendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Récupération des agendas iCal (Google, Outlook, iCloud) sans contrainte CORS.
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
