name: Build Nadendar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Dépendances Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      # La clé signe les paquets de mise à jour (.sig) : l'application n'installe que ceux-là.
      - run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: nadendar-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/rpm/*.rpm

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Le SDK et le NDK Android sont déjà installés sur les machines Ubuntu de GitHub.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Build APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Variable de la machine GitHub (invisible pour ${{ env.* }}) : lue ici.
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "SDK : $ANDROID_HOME — NDK : $NDK_HOME"
          pnpm tauri android init
          # APK de release, optimisée et signée avec la clé fixe du dépôt (ARM 64 bits).
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nadendar-release.jks"
          node scripts/android-signing.mjs "$RUNNER_TEMP/nadendar-release.jks"
          pnpm tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: nadendar-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # À chaque tag v*, les installeurs sont publiés dans une Release GitHub, avec le latest.json
  # que lisent les applications installées pour se mettre à jour.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Noms de fichiers lisibles
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir out
          cp dist/nadendar-windows/nsis/*.exe "out/Nadendar-${V}-windows-setup.exe"
          cp dist/nadendar-windows/msi/*.msi "out/Nadendar-${V}-windows.msi"
          cp dist/nadendar-linux/deb/*.deb "out/Nadendar-${V}-linux-amd64.deb"
          cp dist/nadendar-linux/appimage/*.AppImage "out/Nadendar-${V}-linux-x86_64.AppImage"
          cp dist/nadendar-linux/rpm/*.rpm "out/Nadendar-${V}-linux-x86_64.rpm"
          cp $(find dist/nadendar-android -name '*release*.apk' | head -1) "out/Nadendar-${V}-android-arm64.apk"
          ls -la out
      - name: latest.json (mises à jour automatiques)
        run: |
          python3 - <<'PY'
          import json, os, glob, datetime
          tag = os.environ["GITHUB_REF_NAME"]
          v = tag.lstrip("v")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          sig = lambda pattern: open(glob.glob(pattern)[0]).read().strip()
          notes_file = f".github/release/{tag}.md"
          notes = open(notes_file).read().strip() if os.path.exists(notes_file) else ""
          latest = {
              "version": v,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {"signature": sig("dist/nadendar-windows/nsis/*.exe.sig"), "url": f"{base}/Nadendar-{v}-windows-setup.exe"},
                  "linux-x86_64": {"signature": sig("dist/nadendar-linux/appimage/*.AppImage.sig"), "url": f"{base}/Nadendar-{v}-linux-x86_64.AppImage"},
              },
          }
          json.dump(latest, open("out/latest.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat out/latest.json
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            [ -f ".github/release/$GITHUB_REF_NAME.md" ] && { echo "## ✨ Nouveautés"; echo; cat ".github/release/$GITHUB_REF_NAME.md"; echo; }
            cat .github/release/download.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nadendar ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
